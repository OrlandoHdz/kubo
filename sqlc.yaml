version: "2"
sql:
  - schema: "internal/sql/"
    queries: "internal/sql/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
  - schema: "internal/sql/"
    queries: "db/chat/queries/"
    engine: "postgresql"
    gen:
      go:
        package: "chatdb"
        out: "internal/chat/chatdb"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
